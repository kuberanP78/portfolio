<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9e6d4c"/>
      <stop offset="100%" stop-color="#7a4f32"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle Neural Mesh Background Overlay -->
  <g opacity="0.15" stroke="#18B978" stroke-width="1">
    <line x1="50" y1="100" x2="200" y2="180"/>
    <line x1="200" y1="180" x2="450" y2="120"/>
    <line x1="450" y1="120" x2="550" y2="250"/>
    <line x1="100" y1="400" x2="250" y2="480"/>
    <circle cx="200" cy="180" r="3" fill="#18B978"/>
    <circle cx="450" cy="120" r="3" fill="#18B978"/>
  </g>

  <!-- Suit Body / Shoulders -->
  <path d="M 120 600 L 180 380 Q 300 360, 420 380 L 480 600 Z" fill="url(#suitGrad)" stroke="#2a2a2a" stroke-width="2"/>
  
  <!-- White Shirt & Tie -->
  <polygon points="260,380 340,380 320,490 280,490" fill="#f5f5f5"/>
  <polygon points="290,380 310,380 315,580 285,580" fill="#111111"/>

  <!-- Suit Collars -->
  <polygon points="180,380 260,380 230,460 160,420" fill="#141414" stroke="#2a2a2a"/>
  <polygon points="420,380 340,380 370,460 440,420" fill="#141414" stroke="#2a2a2a"/>

  <!-- Neck -->
  <rect x="270" y="310" width="60" height="80" rx="10" fill="#7a4f32"/>

  <!-- Head / Face -->
  <ellipse cx="300" cy="240" rx="85" ry="105" fill="url(#skinGrad)"/>

  <!-- Hair -->
  <path d="M 205 220 Q 210 110, 300 110 Q 390 110, 395 220 Q 380 130, 300 125 Q 220 130, 205 220 Z" fill="#0c0c0c"/>
  <path d="M 215 150 Q 250 80, 310 85 Q 370 80, 385 150 Q 340 100, 300 105 Q 260 100, 215 150 Z" fill="#141414"/>

  <!-- Eyes -->
  <ellipse cx="265" cy="230" rx="12" ry="7" fill="#ffffff"/>
  <circle cx="265" cy="230" r="5" fill="#1a110b"/>
  <ellipse cx="335" cy="230" rx="12" ry="7" fill="#ffffff"/>
  <circle cx="335" cy="230" r="5" fill="#1a110b"/>

  <!-- Eyebrows -->
  <path d="M 245 212 Q 265 205, 285 212" stroke="#111111" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 315 212 Q 335 205, 355 212" stroke="#111111" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M 300 230 L 295 260 L 305 260" stroke="#5a3820" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Mustache & Mouth -->
  <path d="M 270 278 Q 300 270, 330 278 Q 300 283, 270 278 Z" fill="#141414"/>
  <path d="M 280 295 Q 300 305, 320 295" stroke="#5a3820" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Tech Badge Corner Overlays -->
  <rect x="25" y="25" width="170" height="26" rx="4" fill="#111111" stroke="#2a2a2a"/>
  <circle cx="37" cy="38" r="4" fill="#18B978"/>
  <text x="48" y="42" font-family="monospace" font-size="10" fill="#18B978" font-weight="bold">TOPOLOGICAL MANIFOLD</text>

  <rect x="420" y="25" width="155" height="26" rx="4" fill="#111111" stroke="#2a2a2a"/>
  <text x="432" y="42" font-family="monospace" font-size="10" fill="#18B978" font-weight="bold">NEURAL ARCH / PYTORCH</text>

  <rect x="25" y="545" width="150" height="26" rx="4" fill="#111111" stroke="#2a2a2a"/>
  <text x="37" y="562" font-family="monospace" font-size="10" fill="#F5F5F5" font-weight="bold">MODEL: PRECISION &amp; ETL</text>

  <rect x="405" y="545" width="170" height="26" rx="4" fill="#111111" stroke="#18B978"/>
  <text x="417" y="562" font-family="monospace" font-size="10" fill="#18B978" font-weight="bold">VECTOR INGESTION ACTIVE</text>
</svg>
