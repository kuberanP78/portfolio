  </g>
  
  <!-- Data Telemetry Text -->
  <text x="40" y="440" font-family="monospace" font-size="14" fill="#A5A5A5">NEURAL MODEL MATRIX // DATA SCIENCE ARCHITECTURE</text>
  <text x="620" y="440" font-family="monospace" font-size="14" fill="#18B978">LATENCY: 12ms</text>
