<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#171717"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#2A2A2A" stroke-width="2"/>
  
  <!-- Neural Network Mesh -->
  <g opacity="0.3" stroke="#18B978" stroke-width="1">
    <line x1="100" y1="100" x2="300" y2="150"/>
    <line x1="100" y1="100" x2="300" y2="250"/>
    <line x1="100" y1="250" x2="300" y2="150"/>
    <line x1="100" y1="250" x2="300" y2="350"/>
    <line x1="300" y1="150" x2="550" y2="120"/>
    <line x1="300" y1="150" x2="550" y2="280"/>
    <line x1="300" y1="250" x2="550" y2="280"/>
    <line x1="300" y1="350" x2="550" y2="380"/>
    <line x1="550" y1="120" x2="700" y2="200"/>
    <line x1="550" y1="280" x2="700" y2="200"/>
    <line x1="550" y1="380" x2="700" y2="300"/>
  </g>
  
  <!-- Nodes -->
