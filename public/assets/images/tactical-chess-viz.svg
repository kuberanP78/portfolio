<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#111111"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#2A2A2A" stroke-width="2"/>
  
  <!-- Chess Board Perspective Grid -->
  <path d="M 100 420 L 250 220 L 550 220 L 700 420 Z" fill="#171717" stroke="#2A2A2A" stroke-width="2"/>
  <path d="M 250 220 L 550 220 M 215 270 L 585 270 M 175 320 L 625 320 M 135 370 L 665 370" stroke="#262626" stroke-width="1.5"/>
  <path d="M 325 220 L 250 420 M 400 220 L 400 420 M 475 220 L 550 420" stroke="#262626" stroke-width="1.5"/>

  <!-- Glowing Green Tactical Vectors -->
  <g stroke="#18B978" stroke-width="2.5" fill="none">
    <line x1="400" y1="320" x2="300" y2="250"/>
    <line x1="400" y1="320" x2="500" y2="250"/>
    <line x1="400" y1="320" x2="400" y2="230"/>
    <line x1="400" y1="320" x2="260" y2="340"/>
    <line x1="400" y1="320" x2="540" y2="340"/>
  </g>

  <!-- Arrow Heads -->
  <polygon points="300,250 315,255 310,265" fill="#18B978"/>
  <polygon points="500,250 490,265 485,255" fill="#18B978"/>
  <polygon points="400,230 393,245 407,245" fill="#18B978"/>

  <!-- King Chess Piece Silhouette -->
  <g fill="#F5F5F5" stroke="#111111" stroke-width="2" transform="translate(375, 230)">
    <!-- Crown Cross -->
    <rect x="21" y="0" width="8" height="15"/>
    <rect x="17" y="4" width="16" height="6"/>
    <!-- Head Base -->
    <path d="M 10 20 Q 25 15, 40 20 L 35 45 Q 25 50, 15 45 Z"/>
    <circle cx="25" cy="20" r="12"/>
    <!-- Body -->
    <path d="M 12 45 L 38 45 L 45 90 L 5 90 Z"/>
    <!-- Base -->
    <rect x="0" y="90" width="50" height="15" rx="3"/>
  </g>

  <!-- Overlay Badges -->
  <text x="40" y="50" font-family="monospace" font-size="12" fill="#18B978">FILE: E4-E5 // EVAL: +0.43</text>
  <text x="540" y="50" font-family="monospace" font-size="12" fill="#A5A5A5">PATTERN RECOGNITION: ACTIVE</text>
  <rect x="520" y="430" width="220" height="26" fill="#111111" stroke="#18B978"/>
  <text x="535" y="447" font-family="monospace" font-size="11" fill="#18B978" font-weight="bold">POSITIONAL DEPTH ANALYSIS</text>
</svg>
